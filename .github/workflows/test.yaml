name: Test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-bundle:
    name: Unit tests and committed bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Install locked dependencies.
        run: node .yarn/releases/yarn-4.15.0.cjs install --immutable
      - name: Type-check and run unit tests.
        run: node .yarn/releases/yarn-4.15.0.cjs test --runInBand
      - name: Rebuild the action and verify committed bundles.
        run: |
          node .yarn/releases/yarn-4.15.0.cjs build
          git diff --exit-code -- dist
  save-cache:
    name: Save Cache
    needs: unit-and-bundle
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start Docker on Windows.
        if: runner.os == 'Windows'
        run: |
          $service = Get-Service -Name docker -ErrorAction SilentlyContinue
          if ($null -ne $service -and $service.Status -ne 'Running') {
            Start-Service docker
          }
        shell: powershell
      - name: Save Docker images.
        uses: ./
        with:
          key: docker-cache-test-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build one tagged and one dangling empty test Docker image.
        run: |
          if [[ "${{ matrix.os }}" =~ 'windows' ]]; then
            DOCKERFILE='Dockerfile.windows'
          else
            DOCKERFILE='Dockerfile'
          fi
          docker build --tag empty . --file "$DOCKERFILE" # Dangling image
          docker build --tag empty --no-cache . --file "$DOCKERFILE" # Tagged image
        shell: bash
  restore-cache:
    name: Restore Cache
    timeout-minutes: 20
    needs:
      - save-cache
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write # for cache deletion
    steps:
      - name: Check out repository.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start Docker on Windows.
        if: runner.os == 'Windows'
        run: |
          $service = Get-Service -Name docker -ErrorAction SilentlyContinue
          if ($null -ne $service -and $service.Status -ne 'Running') {
            Start-Service docker
          }
        shell: powershell
      - name: Load Docker images.
        id: restore
        uses: ./
        with:
          key: docker-cache-test-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify Docker loaded cached empty image.
        run: |
          [[ '${{ steps.restore.outputs.cache-hit }}' == 'true' ]] \
            || { echo 'Expected a cache hit from the save job'; exit 1; }
          id="$(docker images --quiet --filter 'reference=empty')"
          [[ -n "$id" ]] || { echo 'Image "empty" not found'; exit 1; }
        shell: bash
      - name: Delete test cache if permitted (i.e., workflow not triggered from fork).
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          key='docker-cache-test-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}'
          url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/caches?key=$key"
          echo "Deleting cache key: $key"
          echo "DELETE $url"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request DELETE \
            --header 'Accept: application/vnd.github.v3+json' \
            --header 'Authorization: Bearer ${{ github.token }}' \
            "$url" \
          || echo "Cache not found (non-fatal)."
        shell: bash
